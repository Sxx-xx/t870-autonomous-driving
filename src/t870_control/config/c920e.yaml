/**:
  ros__parameters:
    camera_name: "t870_c920e"
    video_device: "/dev/video2"
    frame_id: "camera_optical_frame"
    framerate: 30.0
    image_width: 640
    image_height: 480
    io_method: "mmap"
    pixel_format: "yuyv2rgb"
    av_device_format: "YUV422P"

    # 실제 차량 장착 후 camera_calibration 결과 YAML URI로 교체한다.
    camera_info_url: ""

    # 첫 영상 확인 단계에서는 자동 보정을 사용한다. 실외 시험 후 고정값 검토.
    brightness: -1
    contrast: -1
    saturation: -1
    sharpness: -1
    gain: -1
    auto_white_balance: true
    white_balance: 4000
    autoexposure: true
    exposure: 100
    autofocus: true
    focus: -1
    skip_device_check: false
